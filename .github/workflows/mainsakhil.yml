name: Banking Quiz are

on:
  workflow_dispatch:

jobs:
  quiz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Quiz Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BANKING_CHAT_ID }}
          FILE_NAME: SSC_sample_10_questions.csv
        run: python bot.py
